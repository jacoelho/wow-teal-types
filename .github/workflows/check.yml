name: Check declarations and consumers

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Teal
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install tl 0.24.8
          test "$(tl --version)" = 0.24.8

      - parallel:
          - name: Check declarations and example
            run: bash check-all.sh

          - name: Go tests
            run: GOTOOLCHAIN=local GOWORK=off go test ./...

          - name: CDN tests
            run: GOTOOLCHAIN=local go test -C tools/cdn ./...

      # Each branch writes its own outputs: examples/WowTealExample/build and dist/, or
      # build/rockspecs/.
      - parallel:
          - name: Consumer archive
            run: |
              bin/wow-teal build examples/WowTealExample/src --output examples/WowTealExample/build
              scripts/check-consumer-archive.sh

          - name: Rockspecs
            run: |
              bin/wow-teal rockspecs --check
              bin/wow-teal rockspecs --repository "$GITHUB_REPOSITORY"
              bin/wow-teal rockspecs --repository "$GITHUB_REPOSITORY" --check
              for recipe in build/rockspecs/*.rockspec; do
                luarocks lint "$recipe"
              done

      - name: Retain consumer and recipe artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wow-teal-types-candidates
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
            build/rockspecs/*.rockspec
