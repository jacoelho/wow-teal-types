name: Upload declaration recipe to LuaRocks

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate a candidate without uploading
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  generator:
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/generator.yml

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache: false
      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
      - name: Generate and lint
        env:
          ROCKSPEC_DESCRIPTION_JSON: ${{ vars.ROCKSPEC_DESCRIPTION_JSON }}
        run: |
          bin/wow-teal rockspecs --check
          recipe_arguments=(--repository "$GITHUB_REPOSITORY")
          if test -n "$ROCKSPEC_DESCRIPTION_JSON"; then
            recipe_arguments+=(--description-json "$ROCKSPEC_DESCRIPTION_JSON")
          fi
          bin/wow-teal rockspecs "${recipe_arguments[@]}"
          bin/wow-teal rockspecs "${recipe_arguments[@]}" --check
          for recipe in build/rockspecs/*.rockspec; do
            luarocks lint "$recipe"
          done
          echo "MIT declaration recipe passed LuaRocks lint." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-declaration-recipe
          if-no-files-found: error
          path: build/rockspecs/*.rockspec

  upload:
    if: ${{ !inputs.dry_run }}
    needs: [prepare, generator]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: luarocks
    env:
      ROCKSPEC_DESCRIPTION_JSON: ${{ vars.ROCKSPEC_DESCRIPTION_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache: false
      - name: Require configured publication and the matching tag
        env:
          PUBLISH_ENABLED: ${{ vars.LUAROCKS_PUBLISH_ENABLED }}
        run: |
          test "$PUBLISH_ENABLED" = true || { echo "Set LUAROCKS_PUBLISH_ENABLED=true after configuring the luarocks environment." >&2; exit 1; }
          version="$(bin/wow-teal version)"
          test "$GITHUB_REF" = "refs/tags/v$version" || { echo "Run an upload from the matching package version tag." >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/v$version^{commit}")"
      - name: Install pinned compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          luarocks --lua-version=5.1 --tree="$RUNNER_TEMP/rocks" install tl 0.24.8-1
          echo "$RUNNER_TEMP/rocks/bin" >> "$GITHUB_PATH"
      - name: Verify tagged snapshot
        run: |
          bash check-all.sh
          GOTOOLCHAIN=local GOWORK=off go test ./internal/consumer
          bin/wow-teal rockspecs --check
          recipe_arguments=(--repository "$GITHUB_REPOSITORY")
          if test -n "$ROCKSPEC_DESCRIPTION_JSON"; then
            recipe_arguments+=(--description-json "$ROCKSPEC_DESCRIPTION_JSON")
          fi
          bin/wow-teal rockspecs "${recipe_arguments[@]}"
          bin/wow-teal rockspecs "${recipe_arguments[@]}" --check
          for recipe in build/rockspecs/*.rockspec; do
            luarocks lint "$recipe"
          done
          echo "MIT declaration recipe passed LuaRocks lint." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload declarations
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          test -n "$LUAROCKS_API_KEY" || { echo "Configure LUAROCKS_API_KEY in the luarocks environment." >&2; exit 1; }
          version="$(bin/wow-teal version)"
          luarocks upload "build/rockspecs/wow-tl-type-$version-1.rockspec" --api-key "$LUAROCKS_API_KEY"
